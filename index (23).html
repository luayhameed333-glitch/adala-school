function printDoc(html, cls = '') {
  let pr = $('#print'); if (!pr) { pr = document.createElement('div'); pr.id = 'print'; document.body.appendChild(pr); }
  pr.className = cls; pr.innerHTML = html;
  return sleep(150).then(() => window.print());
}
const ymOf = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const MONTHS_AR = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
const ymName = ym => { const [y, m] = ym.split('-'); return MONTHS_AR[+m - 1] + ' ' + y; };
const prevYM = ym => { const [y, m] = ym.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`; };
const avgN = l => l.length ? Math.round(l.reduce((a, b) => a + b, 0) / l.length * 10) / 10 : null;
const docHead = title => `<div class="dh"><img src="${logoSrc()}" alt=""><div><b>${esc(schoolName())}</b><small>${esc(S.school?.year ? 'العام الدراسي ' + S.school.year : '')}</small></div></div><h2 class="dt">${title}</h2>`;

// ---------- ١. التقرير الشهري لولي الأمر ----------
function monthData(s, ym) {
  const inM = t => t && ymOf(t) === ym;
  const grades = [];
  for (const [sk, ex] of Object.entries(s.grades || {})) for (const [ek, g] of Object.entries(ex || {})) if (g && inM(g.at)) grades.push({ subj: sk, exam: ek, g, p: pct(g) });
  grades.sort((a, b) => a.g.at - b.g.at);
  const abs = (s.absences || []).filter(a => a.d && a.d.slice(0, 7) === ym);
  const days = fullDays({ absences: abs }), lessons = abs.filter(a => a.subj).length;
  const beh = (s.behavior || []).filter(b => inM(b.at));
  const certs = (s.feed || []).filter(f => f.type === 'cert' && inM(f.at)).length;
  const summ = (s.summons || []).filter(x => inM(x.at)).length;
  const nums = grades.map(x => x.p).filter(v => typeof v === 'number');
  return { grades, days, lessons, plus: beh.filter(b => b.kind === '+').length, minus: beh.filter(b => b.kind === '-').length, certs, summ, avg: avgN(nums), absent: grades.filter(x => x.g.v === 'غ').length };
}
VIEWS.monthly = async (code, ym) => {
  shell({ title: 'التقرير الشهري', sub: schoolName() });
  const s = await DB.get('students', code); if (!s) return setMain(emptyHTML('غير موجود'));
  if (!S.classes.length) await loadClasses().catch(() => { });
  const now0 = new Date(); let def = ymOf(now0); if (now0.getDate() <= 5) def = prevYM(def);
  ym = ym || def;
  const opts = []; let c = ymOf(now0); for (let i = 0; i < 10; i++) { opts.push([c, ymName(c)]); c = prevYM(c); }
  const d = monthData(s, ym), p = monthData(s, prevYM(ym));
  S.mrep = { s, ym, d, p };
  $('.bar-t').innerHTML = `<b>${esc(s.name)}</b><small>التقرير الشهري · ${esc(clsName(s.cls))} / ${esc(s.sec)}</small>`;
  setMain(`<label class="f"><span>الشهر</span><select class="in" onchange="replace('monthly','${code}',this.value)">${opt(opts, ym)}</select></label>${monthHTML(s, ym, d, p)}
    <button class="btn pri block" onclick="A.mrepPrint()">${icon('print', 'sm')}حفظ PDF / طباعة</button>`);
};
function monthHTML(s, ym, d, p) {
  const diff = d.avg != null && p.avg != null ? Math.round((d.avg - p.avg) * 10) / 10 : null;
  const trend = diff == null ? '' : diff > 0 ? `<span style="color:var(--ok)">▲ تحسّن ${diff}٪ عن الشهر السابق</span>` : diff < 0 ? `<span style="color:var(--bad)">▼ تراجع ${-diff}٪ عن الشهر السابق</span>` : '<span class="muted">مستوى ثابت مقارنة بالشهر السابق</span>';
  const prevBy = {}; for (const x of p.grades) if (typeof x.p === 'number') prevBy[x.subj] = x.p;
  const box = (v, t, col = '') => `<div class="kpi ${col}"><b>${v}</b><small>${t}</small></div>`;
  let verdict = '';
  if (d.avg == null && !d.days && !d.minus) verdict = 'لم تُسجّل درجات خلال هذا الشهر.';
  else {
    const parts = [];
    if (d.avg != null) parts.push(d.avg >= 85 ? 'مستوى دراسي ممتاز' : d.avg >= 70 ? 'مستوى دراسي جيد' : d.avg >= passMark() ? 'مستوى دراسي مقبول ويحتاج مزيداً من المتابعة' : 'مستوى دراسي ضعيف ويحتاج متابعة جادة');
    parts.push(d.days ? `غياب ${daysTxt(d.days)}` : 'التزام تام بالدوام');
    if (d.minus) parts.push(`${d.minus} ملاحظة سلوكية تحتاج انتباهاً`); else if (d.plus) parts.push('سلوك متميز');
    verdict = parts.join('، ') + '.';
  }
  return `<div class="card"><h3>${icon('chart')}تقرير شهر ${esc(ymName(ym))}</h3>
    <div class="kpis">${box(d.avg == null ? '—' : d.avg + '٪', 'معدل درجات الشهر', d.avg == null ? '' : d.avg >= passMark() ? 'ok' : 'bad')}${box(d.days, 'أيام الغياب', d.days ? 'bad' : 'ok')}${box(d.lessons, 'غياب حصص')}${box(d.plus + d.certs, 'ملاحظات إيجابية وتقدير', 'ok')}${box(d.minus, 'ملاحظات سلبية', d.minus ? 'bad' : '')}${box(d.summ, 'استدعاءات', d.summ ? 'bad' : '')}</div>
    ${trend ? `<p style="margin:10px 0 0;font-weight:700">${trend}</p>` : ''}
    <div class="alert info" style="margin:12px 0 0"><h4>${icon('info', 'sm')}الخلاصة</h4>${esc(verdict)}</div></div>
    <div class="card"><h3>${icon('grade')}درجات الشهر</h3>${d.grades.length ? `<table class="tbl"><thead><tr><th>المادة</th><th>الامتحان</th><th>الدرجة</th><th>مقارنة</th></tr></thead><tbody>${d.grades.map(x => {
      const pv = prevBy[x.subj], cmp = typeof x.p === 'number' && pv != null ? (x.p > pv ? '<span style="color:var(--ok)">▲</span>' : x.p < pv ? '<span style="color:var(--bad)">▼</span>' : '＝') : '';
      return `<tr><td>${esc(x.subj)}</td><td>${esc(x.exam)}</td><td style="font-weight:800;color:${typeof x.p === 'number' ? (x.p >= passMark() ? 'var(--ok)' : 'var(--bad)') : 'inherit'}">${esc(gTxt(x.g))}</td><td>${cmp}</td></tr>`;
    }).join('')}</tbody></table>` : '<p class="muted small">لم تُنشر درجات خلال هذا الشهر.</p>'}</div>`;
}
A.mrepPrint = () => {

function calUpcomingBox(clsIds, code) {

function resultOf(s) {
  const c = S.classes.find(x => x.id === s.cls), subs = (c?.subjects || []);
  const fin = finalOf(s.grades);
  const rows = subs.map(sj => ({ sj, v: fin[safeKey(sj)] }));
  const has = rows.filter(r => typeof r.v === 'number');
  const failed = has.filter(r => r.v < passMark()).map(r => r.sj);
  const avg = avgN(has.map(r => r.v));
  let res = 'غير مكتملة', col = '';

  return { rows, failed, avg, res, col, missing: rows.length - has.length };
}

const pushUrl = () => (S.school?.pushUrl || PUSH_URL).trim();
const pushSupported = () => !DEMO && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
const pushOn = () => pushSupported() && Notification.permission === 'granted' && !!LS.get('adala_push_id');
async function sha256hex(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

// ---------- ولي الأمر: تسجيل الموبايل لاستلام الإشعارات ----------
async function registerPush(force = false) {
  if (!pushSupported() || Notification.permission !== 'granted') return false;
  const m = await import(FB_BASE + 'firebase-messaging.js');
  if (!(await m.isSupported())) throw new Error('unsupported');
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const token = await m.getToken(m.getMessaging(FB.mainApp || FB.app), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
  if (!token) throw new Error('no-token');
  const k = kids();
  const codes = k.map(x => x.code).slice(0, 10);
  const staffP = !!LS.get('adala_staff_push', 0);
  const scopes = [...new Set([...(staffP ? ['staff'] : []), ...(k.length || !staffP ? ['all'] : []), ...k.flatMap(x => x.cls ? ['c:' + x.cls, 's:' + x.cls + '|' + x.sec] : [])])].slice(0, 25);
  const sig = JSON.stringify([token, codes, scopes]);
  if (!force && LS.get('adala_push_sig') === sig) return true;
  const id = await sha256hex(token);
  await DB.set('tokens', id, { token, codes, scopes, at: now() });
  LS.set('adala_push_sig', sig); LS.set('adala_push_id', id);
  return true;
}
A.enablePush = () => busy('#pushBtn', async () => {
  if (DEMO) return toast('تعمل الإشعارات بعد ربط قاعدة البيانات', 'bad');
  if (!pushSupported()) return toast('هذا الهاتف أو المتصفح لا يدعم الإشعارات', 'bad');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return toast('لم يُسمح بالإشعارات. يرجى تفعيلها من إعدادات الهاتف ← التطبيقات ← ثانوية العدالة ← الإشعارات', 'bad');
  try { await registerPush(true); } catch (e) { return toast('تعذّر تفعيل الإشعارات، يرجى التأكد من الإنترنت والمحاولة مرة أخرى', 'bad'); }
  kids().forEach(k => DB.update('students', k.code, { 'parent.push': now() }).catch(() => { }));
  toast('تم تفعيل الإشعارات، وستصلك أخبار المدرسة حتى لو كان التطبيق مغلقاً', 'ok'); refresh();
});
function pushCardHTML() {
  if (!pushSupported()) return '';
  if (pushOn()) return `<p class="hint" style="margin:-4px 2px 12px;display:flex;align-items:center;gap:6px">${icon('bell', 'sm')}الإشعارات مفعّلة <button class="btn sm" style="margin-inline-start:auto" onclick="A.pushHelp()">لا تصلني؟</button></p>`;
  return `<div class="alert ok"><h4>${icon('bell')}فعّل الإشعارات</h4>لتصلك درجات الطالب وغياباته وتبليغات المدرسة حتى لو كان التطبيق مغلقاً.
    <button class="btn ok block" id="pushBtn" style="margin-top:10px" onclick="A.enablePush()">${icon('bell', 'sm')}تفعيل الإشعارات</button></div>`;
}
A.pushHelp = () => openModal('إذا لم تصلك الإشعارات', `<ol style="line-height:2;padding-inline-start:20px;margin-top:0">
  <li>افتح <b>الإعدادات</b> في الهاتف ← <b>التطبيقات</b> ← <b>ثانوية العدالة</b>.</li>
  <li>اضغط <b>الإشعارات</b> وتأكد من تفعيلها.</li>
  <li>اضغط <b>البطارية</b> واختر <b>غير مقيّد</b>، كي لا يوقفه الهاتف.</li>
  <li>ارجع إلى التطبيق واضغط الزر أدناه.</li></ol>
  <button class="btn pri block" id="pushBtn" onclick="A.enablePush()">${icon('refresh', 'sm')}إعادة تفعيل الإشعارات</button>`);

// ---------- الإدارة والمدرسين: إرسال الإشعارات ----------
async function pushCall(payload, au = FB.auth) {
  const url = pushUrl(); if (!url || DEMO || !au?.currentUser) return null;
  const idToken = await au.currentUser.getIdToken();
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...payload, idToken, title: schoolName(), base: appBase() }), redirect: 'follow' });
  return r.json().catch(() => null);
}
// رسالة خاصة لكل طالب: [{code, body}]
function pushItems(items) {
  if (!pushUrl() || DEMO || !items.length) return;
  const au = FB.auth;
  (async () => { for (let i = 0; i < items.length; i += 15) await pushCall({ items: items.slice(i, i + 15) }, au).catch(e => console.warn(e)); })();
}
// رسالة وحدة لصف أو شعبة أو كل المدرسة
function pushScope(scopes, body) {
  if (!pushUrl() || DEMO) return;
  const au = FB.auth;
  (async () => {
    let cursor = null, n = 0;
    do { const r = await pushCall({ scopes, body, cursor }, au).catch(() => null); cursor = r?.next || null; } while (cursor && ++n < 80);
  })();
}
const short = (s, n = 150) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

boot();

</script>
