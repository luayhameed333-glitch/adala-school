<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ثانوية العدالة للبنين</title>
<meta name="description" content="منصة التواصل بين ثانوية العدالة للبنين وأولياء الأمور">
<meta name="theme-color" content="#0f4c5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5;--card:#ffffff;--ink:#14302b;--mut:#5d736f;--line:#dde5e3;--soft:#eef3f2;
  --pri:#0f4c5c;--pri2:#16697d;--priInk:#ffffff;--gold:#c9a227;--goldSoft:#f6eccb;
  --ok:#1e8449;--okbg:#e4f3ea;--warn:#b7791f;--warnbg:#fcf1d8;--bad:#c0392b;--badbg:#fbe5e2;
  --shadow:0 1px 2px rgba(15,40,35,.06),0 6px 18px rgba(15,40,35,.06);
  --r:14px;--font:'Tajawal',system-ui,sans-serif;--title:'Amiri',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514;--card:#16211f;--ink:#e4edeb;--mut:#93a8a4;--line:#26332f;--soft:#1c2926;
  --pri:#0e3d49;--pri2:#2a8ea2;--priInk:#ffffff;--gold:#d8b444;--goldSoft:#3a3216;
  --ok:#48b97a;--okbg:#15301f;--warn:#e0a83e;--warnbg:#33290f;--bad:#ec6b5c;--badbg:#3a1a16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1514;--card:#16211f;--ink:#e4edeb;--mut:#93a8a4;--line:#26332f;--soft:#1c2926;
  --pri:#0e3d49;--pri2:#2a8ea2;--priInk:#ffffff;--gold:#d8b444;--goldSoft:#3a3216;
  --ok:#48b97a;--okbg:#15301f;--warn:#e0a83e;--warnbg:#33290f;--bad:#ec6b5c;--badbg:#3a1a16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
body{min-height:100vh;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.ic{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle}
.ic.sm{width:18px;height:18px}.ic.lg{width:30px;height:30px}

/* ---- top bar ---- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 10px;background:var(--pri);color:var(--priInk);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bar-t b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t small{opacity:.8;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;position:relative}
.ib:active{background:rgba(255,255,255,.14)}
.ib-sp{width:42px}
.demo{background:var(--goldSoft);color:var(--ink);font-size:13px;padding:7px 14px;text-align:center;border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.wrap:has(+ .devf){padding-bottom:20px}
.devf{max-width:760px;margin:0 auto;padding:12px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:12.5px;line-height:1.6}
.devf b{color:var(--ink);font-weight:700}
.devf-i{display:flex;justify-content:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.devf-i a{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);text-decoration:none;font-size:12px;background:var(--card)}
.devf-i a.wa svg{color:#25D366}
.devf-i a.tg svg{color:#229ED9}
.wrap:has(.devs) + .devf{display:none}
@media print{.devf{display:none!important}}

/* ---- welcome ---- */
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 16px 18px;background:var(--bg)}
.w-hero{align-self:stretch;margin:0 -16px;padding:12px 16px 58px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,var(--pri2),var(--pri) 70%);border-radius:0 0 34px 34px;box-shadow:0 10px 30px rgba(15,76,92,.25)}
.w-top{align-self:stretch;display:flex;justify-content:flex-start;color:#fff}
.w-logo{width:112px;height:112px;margin-top:4px;border-radius:50%;background:var(--card);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;place-items:center;overflow:hidden}
.w-logo img,.w-logo svg{width:100%;height:100%;object-fit:contain;border-radius:50%}
.w-name{font-family:var(--title);font-size:34px;margin:14px 0 0;color:#fff;text-align:center;line-height:1.3;text-shadow:0 2px 10px rgba(0,0,0,.2)}
.w-sub{margin:4px 0 0;color:rgba(255,255,255,.85);font-size:15px;text-align:center}
.gates{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;margin-top:-36px;position:relative}
.gate{display:flex;align-items:center;gap:14px;text-align:right;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.gate:active{transform:scale(.99)}
.gate b{display:block;font-size:17.5px}
.gate small{display:block;color:var(--mut);font-size:13.5px}
.g-ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--soft);color:var(--pri2);flex:none}
.gate.main .g-ic{background:var(--pri);color:var(--gold)}
.g-go{margin-inline-start:auto;color:var(--mut)}
.credit{margin-top:auto;padding:22px 8px 4px;border:0;background:none;color:var(--mut);font-size:13px;cursor:pointer}
.credit b{color:var(--ink);font-weight:700}
.demo-note{max-width:440px;font-size:13px;color:var(--mut);text-align:center;margin:16px 0 0}

/* ---- cards / layout ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16.5px;display:flex;align-items:center;gap:8px}
.card h3 .ic{color:var(--pri2)}
.muted{color:var(--mut)}.small{font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-t{font-size:14px;color:var(--mut);margin:18px 2px 8px;font-weight:700}
.empty{padding:28px 10px;text-align:center;color:var(--mut)}
.empty .ic{width:40px;height:40px;opacity:.5;display:block;margin:0 auto 8px}
.loading{padding:40px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pri2);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.editing .tile{touch-action:none;user-select:none;-webkit-user-select:none;border-style:dashed;border-color:var(--pri2);cursor:grab;animation:jig .35s ease-in-out infinite alternate}
.tiles.editing .tile:nth-child(2n){animation-delay:-.17s}
.tiles.editing .tile.drag{animation:none;z-index:5;cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.25);opacity:.95;position:relative}
@keyframes jig{from{rotate:-1.2deg}to{rotate:1.2deg}}
@media (prefers-reduced-motion:reduce){.tiles.editing .tile{animation:none}}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;text-align:center;font-size:13.5px;font-weight:700;line-height:1.3}
.tile .ic{width:28px;height:28px;color:var(--pri2)}
.tile:active{transform:scale(.97)}
/* tile colors: لون هادئ لكل قسم، ويتقلب بالوضع الليلي */
.tic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--tb,var(--soft));color:var(--tf,var(--pri2))}
.tile .tic .ic{width:25px;height:25px;color:inherit}
.tc-blue{--tb:#E6F1FB;--tf:#185FA5}.tc-purple{--tb:#EEEDFE;--tf:#534AB7}.tc-amber{--tb:#FAEEDA;--tf:#854F0B}.tc-green{--tb:#EAF3DE;--tf:#3B6D11}.tc-red{--tb:#FCEBEB;--tf:#A32D2D}.tc-teal{--tb:#E1F5EE;--tf:#0F6E56}.tc-pink{--tb:#FBEAF0;--tf:#993556}.tc-coral{--tb:#FAECE7;--tf:#993C1D}.tc-gray{--tb:#F1EFE8;--tf:#5F5E5A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tc-blue{--tb:#0C447C;--tf:#B5D4F4}:root:not([data-theme="light"]) .tc-purple{--tb:#3C3489;--tf:#CECBF6}:root:not([data-theme="light"]) .tc-amber{--tb:#633806;--tf:#FAC775}:root:not([data-theme="light"]) .tc-green{--tb:#27500A;--tf:#C0DD97}:root:not([data-theme="light"]) .tc-red{--tb:#791F1F;--tf:#F7C1C1}:root:not([data-theme="light"]) .tc-teal{--tb:#085041;--tf:#9FE1CB}:root:not([data-theme="light"]) .tc-pink{--tb:#72243E;--tf:#F4C0D1}:root:not([data-theme="light"]) .tc-coral{--tb:#712B13;--tf:#F5C4B3}:root:not([data-theme="light"]) .tc-gray{--tb:#444441;--tf:#D3D1C7}}
:root[data-theme="dark"] .tc-blue{--tb:#0C447C;--tf:#B5D4F4}:root[data-theme="dark"] .tc-purple{--tb:#3C3489;--tf:#CECBF6}:root[data-theme="dark"] .tc-amber{--tb:#633806;--tf:#FAC775}:root[data-theme="dark"] .tc-green{--tb:#27500A;--tf:#C0DD97}:root[data-theme="dark"] .tc-red{--tb:#791F1F;--tf:#F7C1C1}:root[data-theme="dark"] .tc-teal{--tb:#085041;--tf:#9FE1CB}:root[data-theme="dark"] .tc-pink{--tb:#72243E;--tf:#F4C0D1}:root[data-theme="dark"] .tc-coral{--tb:#712B13;--tf:#F5C4B3}:root[data-theme="dark"] .tc-gray{--tb:#444441;--tf:#D3D1C7}

.badge{position:absolute;top:8px;left:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;display:grid;place-items:center}
.bar .badge{top:4px;left:4px}

/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13.5px;color:var(--mut);margin-bottom:5px;font-weight:700}
.in,select.in,textarea.in{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none;min-height:48px}
.in:focus{border-color:var(--pri2);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri2) 18%,transparent)}
textarea.in{min-height:120px;resize:vertical;line-height:1.7}
.in.code{font-size:24px;letter-spacing:3px;text-align:center;direction:ltr;font-weight:700}
.in.bad{border-color:var(--bad);background:var(--badbg)}
.hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.pw{position:relative}.pw .in{padding-left:48px}
.pw button{position:absolute;left:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--mut);cursor:pointer}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri2);border-color:var(--pri2);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d1600}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.fill{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.sticky-act{position:fixed;bottom:0;left:0;right:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center}
.sticky-act .btn{flex:1;max-width:360px}

/* chips & segmented */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:13.5px;font-weight:600}
.chip.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
.chip.on.neg{background:var(--bad);border-color:var(--bad)}
.chip.on.pos{background:var(--ok);border-color:var(--ok)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;position:relative}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-inline-start:5px;vertical-align:middle}

/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--mut)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.pri{background:color-mix(in srgb,var(--pri2) 15%,transparent);color:var(--pri2)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--mut);font-size:13px}
.num{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12.5px;color:var(--mut);flex:none}
.code-t{direction:ltr;font-family:ui-monospace,Menlo,monospace;letter-spacing:1px;font-size:13.5px}

/* grade table */
.gr{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.gr .nm{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.35}
.gr input{width:78px;text-align:center;font-weight:700;font-size:18px;padding:8px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);direction:ltr}
.gr input:focus{outline:none;border-color:var(--pri2)}
.gr input.bad{border-color:var(--bad);background:var(--badbg)}
.gr input.abs{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.gr .ab{width:40px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;color:var(--mut)}
.gr .ab.on{background:var(--warn);border-color:var(--warn);color:#fff}
.gr .need{font-size:12px;color:var(--mut);width:100%}
.att{min-width:84px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--okbg);color:var(--ok);font-weight:700;cursor:pointer}
.att.on{background:var(--bad);border-color:var(--bad);color:#fff}

/* paste review */
.pv{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line)}
.pv .st{width:12px;height:12px;border-radius:50%;margin-top:7px;flex:none}
.st.g{background:var(--ok)}.st.y{background:var(--warn)}.st.r{background:var(--bad)}.st.x{background:var(--line)}
.pv .t{flex:1;min-width:0}
.pv .t small{color:var(--mut);display:block}
.pv select{margin-top:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* modal */
.mb{position:fixed;inset:0;z-index:60;background:rgba(5,15,13,.5);display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.md{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));animation:su .2s ease-out}
@media (min-width:700px){.mb{align-items:center}.md{border-radius:22px}}
.md-h{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:8px;padding:10px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:14px}
.md-h b{flex:1;font-size:17px}
.md-h .ib{color:var(--ink);background:var(--soft)}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:.6}}

/* toast */
.toast{position:fixed;z-index:90;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17302b;color:#fff;padding:11px 18px;border-radius:12px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;animation:su .2s}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}

/* parent */
.kid{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;width:100%;text-align:right}
.kid .av{width:48px;height:48px;border-radius:50%;background:var(--pri);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.pcode-c{padding:12px 14px}.pcode-c h3{margin-bottom:8px;font-size:15px}
.pcode-c .in.code{font-size:20px;padding:8px 10px;letter-spacing:2px}.pcode-c .btn{padding-top:9px;padding-bottom:9px}
#kidsBox .kid{padding:10px 12px;margin-bottom:8px;gap:10px}#kidsBox .kid .av{width:40px;height:40px;font-size:17px}
.kid .t{flex:1;min-width:0}.kid .t b{display:block;font-size:16px}.kid .t small{color:var(--mut)}
.alert{border-radius:14px;padding:14px;margin-bottom:12px;border:1.5px solid}
.alert.bad{background:var(--badbg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.alert.warn{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.alert.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.alert h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;font-size:16px}
.alert.bad h4{color:var(--bad)}.alert.warn h4{color:var(--warn)}.alert.ok h4{color:var(--ok)}
.letter{white-space:pre-wrap;background:var(--card);border-radius:10px;padding:12px;border:1px dashed var(--line);font-size:14.5px;line-height:1.9;margin:8px 0}
.subj{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.subj-h{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.mark{background:var(--soft);border-radius:10px;padding:7px 8px;text-align:center}
.mark small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.mark b{font-size:19px}
.mark.low b{color:var(--bad)}.mark.hi b{color:var(--ok)}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat small{color:var(--mut);font-size:12.5px}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.hbar .lb{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{display:block;flex:1;height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.hbar .fl{display:block;height:100%;background:var(--pri2);border-radius:6px}
.hbar .fl.low{background:var(--bad)}
.hbar .vl{width:44px;text-align:left;font-weight:700;direction:ltr}
.chart svg{width:100%;height:auto;display:block}

/* developer card */
.dev{text-align:center}
.dev .av{width:84px;height:84px;margin:4px auto 10px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--gold);display:grid;place-items:center;font-family:var(--title);font-size:38px;box-shadow:var(--shadow)}
.dev h2{margin:0;font-size:21px}
.dev p{margin:2px 0 14px;color:var(--mut)}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-align:right}
.ph b{flex:1;direction:ltr;text-align:right;font-size:16px;letter-spacing:.5px}
.soc{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.soc a{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--ink);text-decoration:none}
.soc a:active{transform:scale(.95)}
.soc .fb{color:#1877f2}.soc .wa{color:#25d366}.soc .tg{color:#229ed9}.soc .ig{color:#d6249f}.soc .tt{color:var(--ink)}

/* scanner */
.scan{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1}
.scan video{width:100%;height:100%;object-fit:cover}
.scan .fr{position:absolute;inset:18%;border:3px solid var(--gold);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

/* extras */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:20px;line-height:1.3}.kpi small{color:var(--mut);font-size:12px;line-height:1.3;display:block}
.kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
.tbl th{color:var(--mut);font-weight:600;font-size:12.5px;background:var(--soft)}
.tbl.gb td,.tbl.gb th{white-space:nowrap}
.doc .dh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #0B4F33;padding-bottom:8px;margin-bottom:8px}
.doc .dh img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.doc .dh b{display:block;font-size:1.15em;color:#0B4F33}.doc .dh small{color:#555}
.doc .dt{text-align:center;margin:6px 0 10px;font-size:1.2em}
.doc .di{margin:4px 0 8px}.doc .rbig{font-weight:800;font-size:1.15em}
.doc .sigs{display:flex;justify-content:space-between;margin-top:14mm;text-align:center;gap:20px}
.doc .dsig{text-align:left;margin-top:8mm;font-weight:700}
/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;inset:0;background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pg{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));height:275mm;break-inside:avoid;page-break-inside:avoid;overflow:hidden;page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
  #print.single .pg{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
  #print.single .pc{width:120mm;height:115mm;margin:15mm auto 0;padding:6mm 7mm;border-style:solid}
  #print.single .pc .sc{display:none}
  #print.single .pc .qr{width:32mm;height:32mm}
  #print.single .pc .how{font-size:9pt}
  .pc{border:1px dashed #888;padding:4mm 5mm;overflow:hidden;display:flex;flex-direction:column;gap:1.8mm;position:relative;font-family:var(--font);text-align:right}
  .pc>*{flex-shrink:0}
  .pc .sc{position:absolute;top:-2.6mm;right:6mm;font-size:9pt;background:#fff;color:#777;line-height:1}
  .pc .sch{display:flex;align-items:center;gap:2mm;font-family:var(--title);font-size:11.5pt;font-weight:700;border-bottom:1px solid #ccc;padding-bottom:.8mm}
  .pc .sch img,.pc .sch svg{width:8mm;height:8mm;border-radius:50%}
  .pc .stn{font-size:12pt;font-weight:800;line-height:1.25}
  .pc .stc{font-size:9.5pt;color:#333}
  .pc .cd{direction:ltr;text-align:center;font-size:15pt;font-weight:800;letter-spacing:1.5px;border:1.5px solid #000;border-radius:2mm;padding:.8mm}
  .pc .qrs{display:flex;align-items:center;justify-content:center;gap:5mm;margin:auto 0}
  .pc .q{display:flex;flex-direction:column;align-items:center;gap:1mm}
  .pc .lb{display:flex;align-items:center;gap:1.5mm;font-size:10pt;font-weight:800}
  .pc .n{width:5mm;height:5mm;border-radius:50%;background:#000;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:8pt;line-height:1}
  .pc .qr{width:24mm;height:24mm}
  .pc .qr svg,.pc .qr img{width:100%;height:100%;display:block}
  .pc .sub{font-size:7.5pt;color:#444}
  .pc .ar{font-size:16pt;color:#555}
  .plist{font-family:var(--font);color:#000}
  .plist .dh,.doc .dh{display:flex;align-items:center;gap:4mm;border-bottom:2px solid #0B4F33;padding-bottom:2mm;margin-bottom:3mm}
  .plist .dh img{width:14mm;height:14mm;border-radius:50%}
  .plist .dt{font-size:13pt;margin:0 0 2mm}
  .doc{font-family:var(--font);color:#000;font-size:11pt}
  .doc .card{border:1px solid #bbb;border-radius:3mm;padding:3mm 4mm;margin:0 0 3mm;box-shadow:none;break-inside:avoid}
  .doc .card h3{font-size:12pt;margin:0 0 2mm}
  .doc .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:2mm}.doc .kpi{border:1px solid #ccc;border-radius:2mm;padding:2mm;text-align:center}
  .doc .tbl{width:100%;border-collapse:collapse}.doc .tbl th,.doc .tbl td{border:1px solid #999;padding:1.5mm 2mm;text-align:center}
  .doc svg{width:4mm;height:4mm}
  .docs .doc{page-break-after:always;break-after:page;padding:6mm 4mm}
  .docs .doc:last-child{page-break-after:auto;break-after:auto}
  .plist h2{font-size:14pt;margin:0 0 2mm}
  .plist p{font-size:10pt;margin:0 0 4mm;color:#333}
  .plist table{width:100%;border-collapse:collapse;font-size:10.5pt}
  .plist th,.plist td{border:1px solid #999;padding:1.6mm 2mm;text-align:right}
  .plist th{background:#eee}
  .pc .how{font-size:7.8pt;color:#222;line-height:1.4;border-top:1px solid #ddd;padding-top:1.2mm}
}

/* developer strip */
.devs{margin-top:18px;padding:14px 12px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center;box-shadow:var(--shadow)}
.devs>small{display:block;color:var(--mut);font-size:12.5px}
.devs>b{display:block;font-size:16.5px;margin:2px 0 8px}
.devs-ph{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.devs-ph a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:var(--soft);color:var(--ink);text-decoration:none;font-weight:700;font-size:14.5px;letter-spacing:.3px}
.soc.sm{margin:10px 0 4px;gap:8px}.soc.sm a{width:40px;height:40px;border-radius:12px}
.lgx canvas{width:100%;max-width:300px;aspect-ratio:1/1;display:block;margin:0 auto 14px;border-radius:16px;touch-action:none;cursor:grab}
.w-logo{background:#fff}

/* timetables */
.ttw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
.tt{border-collapse:collapse;width:100%;min-width:max-content;font-size:14px}
.tt th,.tt td{border:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap}
.tt th{background:var(--pri);color:#fff;font-weight:700}
.tt td:first-child{background:var(--soft);font-weight:700}
.tt tbody tr:nth-child(even) td:not(:first-child){background:color-mix(in srgb,var(--soft) 50%,transparent)}
.tt.edit th,.tt.edit td{padding:0}
.tt.edit input{width:104px;border:0;background:transparent;padding:10px 8px;text-align:center;font:inherit;color:inherit;outline:none}
.tt.edit th input{color:#fff;font-weight:700}
.tt.edit input:focus{background:color-mix(in srgb,var(--pri2) 12%,transparent)}
.tt-thumb{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff;margin-top:10px;cursor:zoom-in}
.tt-view{overflow:auto;max-height:68vh;border-radius:12px;border:1px solid var(--line);background:#fff;touch-action:pan-x pan-y pinch-zoom}
.tt-view img{display:block;width:100%;height:auto}

/* شاشة الترحيب المضغوطة: كلها تبين بدون نزول */
.welcome{min-height:100vh;min-height:100dvh;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.w-hero{padding:8px 16px 44px;border-radius:0 0 28px 28px}
.w-top .ib{width:38px;height:38px}
.w-logo{width:86px;height:86px;padding:4px;margin-top:-6px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.w-name{font-size:27px;margin-top:8px}
.w-sub{font-size:13.5px;margin-top:0}
.welcome .gates{gap:9px;margin-top:-28px}
.welcome .gate{padding:11px 13px;gap:12px;border-radius:16px}
.welcome .gate b{font-size:16px}
.welcome .gate small{font-size:12.5px}
.welcome .g-ic{width:44px;height:44px;border-radius:13px}
.welcome .g-ic .ic.lg{width:25px;height:25px}
.demo-note{margin:8px 0 0;font-size:12px}
.w-dev{width:100%;max-width:440px;margin-top:auto;padding-top:10px}
.devs.cmp{margin-top:0;padding:10px 10px 8px;border-radius:14px}
.devs.cmp>b{font-size:14.5px;margin:0 0 6px}
.devs.cmp>b small{color:var(--mut);font-weight:500;font-size:12.5px}
.devs.cmp .devs-ph a{padding:5px 10px;font-size:13.5px}
.devs.cmp .soc.sm{margin:7px 0 0;gap:7px}
.devs.cmp .soc.sm a{width:34px;height:34px;border-radius:10px}
.devs.cmp .soc.sm .ic{width:19px;height:19px}
@media (max-height:700px){.w-logo{width:70px;height:70px}.w-name{font-size:23px;margin-top:6px}.w-hero{padding-bottom:38px}.welcome .gate{padding:9px 12px}.welcome .g-ic{width:40px;height:40px}}
@media (min-height:780px){.w-logo{width:100px;height:100px}.w-name{font-size:30px;margin-top:10px}.w-hero{padding-bottom:52px}.welcome .gates{gap:12px;margin-top:-32px}.welcome .gate{padding:15px 14px}.welcome .g-ic{width:50px;height:50px}.w-dev{padding-top:18px}}

.devs-sup{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px;font-weight:700;margin:2px 0 7px}
.devs-sup::before,.devs-sup::after{content:"";flex:1;height:1px;background:var(--line)}
.devs.cmp>small{font-size:11.5px}
.devs.cmp>b{margin:0 0 4px}
.devs.cmp .devs-sup{margin:0 0 6px;font-size:11.5px}

/* علم العراق خلف شعار المدرسة */
.w-flag{position:relative;align-self:stretch;margin:0 -16px;height:150px;border-radius:0 0 26px 26px;overflow:hidden;
  background:linear-gradient(180deg,#ce1126 0 33.34%,#ffffff 33.34% 66.66%,#000000 66.66% 100%);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.w-flag::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,.18),rgba(255,255,255,0) 30%,rgba(0,0,0,.08) 60%,rgba(255,255,255,.12) 85%,rgba(0,0,0,.06))}
.w-flag .w-top{position:absolute;top:2px;inset-inline:6px;z-index:2;color:#fff}
.takbir{position:absolute;inset-inline:0;top:33.34%;height:33.33%;display:grid;place-items:center;font-family:var(--title);font-weight:700;font-size:27px;line-height:1;color:#007a3d;letter-spacing:1px}
.welcome .w-logo{position:relative;z-index:3;margin-top:-46px;border:3px solid #fff}
.welcome .w-name{color:var(--ink);text-shadow:none;margin-top:6px}
.welcome .w-sub{color:var(--mut)}
.welcome .gates{margin-top:14px}
@media (max-height:700px){.w-flag{height:126px}.takbir{font-size:23px}.welcome .w-logo{margin-top:-38px}.welcome .gates{margin-top:10px}}
@media (min-height:780px){.w-flag{height:168px}.takbir{font-size:31px}.welcome .w-logo{margin-top:-50px}.welcome .gates{margin-top:18px}}
@media (max-height:700px){.w-dev{padding-top:6px}.demo-note{margin-top:5px}}

.chip.on small{color:inherit;opacity:.85}

#obx{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:8px;max-width:736px;margin:0 auto;padding:10px 12px;border-radius:14px;background:var(--warnbg);color:var(--ink);border:1px solid var(--warn);font-size:13px;line-height:1.5;box-shadow:var(--shadow)}
#obx span{flex:1}
#obx button{border:0;border-radius:10px;padding:6px 10px;background:var(--warn);color:#fff;font:inherit;font-weight:700;cursor:pointer}
@media print{#obx{display:none!important}}
[hidden]{display:none!important}

</style>
</head>

const numD = (d, withYear = true) => `${d.getDate()}/${d.getMonth() + 1}${withYear ? '/' + d.getFullYear() : ''}`;

function go(name, ...args) { NAV.push([name, args]); history.pushState({ d: NAV.length }, ''); window.scrollTo(0, 0); return VIEWS[name](...args); }
function replace(name, ...args) { if (NAV.length) NAV[NAV.length - 1] = [name, args]; else NAV.push([name, args]); window.scrollTo(0, 0); return VIEWS[name](...args); }

const MODAL = { open: false };
function openModal(title, body, { onClose } = {}) {
  closeModalSilently();
  const d = document.createElement('div'); d.className = 'mb'; d.id = 'modal';
  d.innerHTML = `<div class="md" role="dialog" aria-modal="true"><div class="md-h"><b>${esc(title)}</b><button class="ib" onclick="A.closeModal()" aria-label="إغلاق">${icon('x')}</button></div><div id="mdb">${body}</div></div>`;
  d.addEventListener('click', e => { if (e.target === d) A.closeModal(); });
  document.body.appendChild(d); MODAL.open = true; MODAL.onClose = onClose;
  history.pushState({ m: 1 }, '');
  return $('#mdb');
}
function hideModal() { const m = $('#modal'); if (m) m.remove(); MODAL.open = false; const f = MODAL.onClose; MODAL.onClose = null; if (f) f(); }
function closeModalSilently() { if (MODAL.open) { hideModal(); ignorePop++; history.back(); } }
A.closeModal = () => { if (MODAL.open) { hideModal(); ignorePop++; history.back(); } };
function toast(msg, type = '') {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), type === 'bad' ? 4200 : 2800);
}
function confirmBox(msg, { ok = 'تأكيد', danger = false, typeWord = '' } = {}) {
  return new Promise(res => {
    let done = false;
    openModal('تأكيد', `<p style="margin-top:0;white-space:pre-line">${esc(msg)}</p>
      ${typeWord ? `<label class="f"><span>للتأكيد اكتب: ${esc(typeWord)}</span><input class="in" id="cfw" autocomplete="off"></label>` : ''}
      <div class="btns"><button class="btn" id="cfn">إلغاء</button><button class="btn ${danger ? 'danger fill' : 'pri'}" id="cfy">${esc(ok)}</button></div>`,
      { onClose: () => { if (!done) { done = true; res(false); } } });
    $('#cfn').onclick = () => A.closeModal();
    $('#cfy').onclick = () => {
      if (typeWord && $('#cfw').value.trim() !== typeWord) { toast('الكلمة غير مطابقة', 'bad'); return; }
      done = true; A.closeModal(); res(true);
    };
  });
}
async function busy(btn, fn) {
  const b = typeof btn === 'string' ? $(btn) : btn; const old = b ? b.innerHTML : '';
  if (b) { b.disabled = true; b.innerHTML = '<span class="spin" style="width:18px;height:18px;margin:0;border-width:2px"></span>'; }
  try { return await fn(); } catch (e) { toast(errMsg(e), 'bad'); } finally { if (b && document.body.contains(b)) { b.disabled = false; b.innerHTML = old; } }
}

A.gate = async kind => {
  if (kind === 'parent') return go('parentGate');
  useSlot(kind);

  if (!S.school) {
    if (kind === 'admin') return go('setup');
    return toast('الإدارة لم تُجهّز التطبيق بعد', 'bad');
  }
  const me = await loadMe();
  if (!LS.get('adala_gates_v')) { LS.set('adala_gates_v', 1); if (me && me.role === 'teacher') gateUnlock('teacher'); }
  if (me && allowedGate(me, kind) && gateOK(kind)) return go(kind);
  go('login', kind);
};

  applyTheme();

  app().innerHTML = loadingHTML('جارِ تشغيل التطبيق…');

  }
  await AU.ready();
  obBadge(); if (!DEMO) setTimeout(obFlush, 3000);
  await loadSchool().catch(() => null);
  history.replaceState({ d: 0 }, '');
  const qs = new URLSearchParams(location.search);
  const c = toEn(qs.get('code') || '').replace(/\D/g, '');
  if (c) { history.replaceState({ d: 0 }, '', location.pathname); VIEWS.welcome(); return A.openCode(c); }

// ---------- اختيار الصف والشعبة والمادة ----------
function combos() {
  if (allAccess()) return S.classes.flatMap(c => (c.sections || []).map(s => ({ cls: c.id, sec: s, subjs: c.subjects || [] })));
  const m = {};
  for (const a of S.me?.assign || []) {
    if (!S.classes.some(c => c.id === a.cls)) continue;
    const k = a.cls + '|' + a.sec; m[k] ??= { cls: a.cls, sec: a.sec, subjs: [] };
    if (a.subj && !m[k].subjs.includes(a.subj)) m[k].subjs.push(a.subj);
  }
  return Object.values(m);
}
function ensurePick(need = {}) {
  const cs = combos(), p = S.pick;
  const clsList = [...new Set(cs.map(x => x.cls))];
  if (!clsList.includes(p.cls)) p.cls = clsList[0] || '';
  const secs = cs.filter(x => x.cls === p.cls).map(x => x.sec);
  if (!secs.includes(p.sec)) p.sec = secs[0] || '';
  const subjs = cs.find(x => x.cls === p.cls && x.sec === p.sec)?.subjs || [];
  if (need.subj && !subjs.includes(p.subj)) p.subj = subjs[0] || '';
  if (need.exam && !exams().includes(p.exam)) p.exam = exams()[0];
  if (need.date && !p.date) p.date = todayISO();
  LS.set('adala_pick', p);
  return { cs, clsList, secs, subjs };
}
function pickerHTML(need = {}) {
  const { clsList, secs, subjs } = ensurePick(need), p = S.pick;
  const asubjs = need.absSubj ? (allAccess() ? [['', 'دوام عام (كل اليوم)'], ...subjs.map(s => [s, s])] : subjs) : null;
  if (need.absSubj && !asubjs.some(a => (Array.isArray(a) ? a[0] : a) === (p.asubj ?? ''))) p.asubj = Array.isArray(asubjs[0]) ? asubjs[0][0] : (asubjs[0] || '');
  return `<div class="card" style="padding-bottom:4px"><div class="grid2">
    <label class="f"><span>الصف</span><select class="in" onchange="A.pick('cls',this.value)">${opt(clsList.map(c => [c, clsName(c)]), p.cls)}</select></label>
    <label class="f"><span>الشعبة</span><select class="in" onchange="A.pick('sec',this.value)">${opt(secs, p.sec)}</select></label>
    ${need.subj ? `<label class="f"><span>المادة</span><select class="in" onchange="A.pick('subj',this.value)">${opt(subjs, p.subj)}</select></label>` : ''}
    ${need.exam ? `<label class="f"><span>الامتحان</span><select class="in" onchange="A.pick('exam',this.value)">${opt(exams(), p.exam)}</select></label>` : ''}
    ${need.absSubj ? `<label class="f"><span>الدرس</span><select class="in" onchange="A.pick('asubj',this.value)">${opt(asubjs, p.asubj)}</select></label>` : ''}
    ${need.date ? `<label class="f"><span>التاريخ</span><input type="date" class="in" value="${p.date}" onchange="A.pick('date',this.value)" dir="ltr"></label>` : ''}
  </div></div>`;
}
A.pick = (k, v) => { S.pick[k] = v; LS.set('adala_pick', S.pick); refresh(); };

const draftKey = p => `adala_draft|${p.cls}|${p.sec}|${p.subj}|${p.exam}`;
async function gradesSection(m) {
  if (!combos().length) return m.innerHTML = noCombosHTML();
  const head = pickerHTML({ subj: true, exam: true });
  const p = S.pick;
  if (!p.subj) return m.innerHTML = head + emptyHTML('لا توجد مواد لهذا الصف. يمكن إضافتها من "الصفوف والمواد".');
  const pendNote = S.school?.requireApproval && !isManager() ? '<p class="hint" style="margin:-4px 2px 10px">تُرسل الدرجات إلى الإدارة للموافقة قبل وصولها إلى أولياء الأمور.</p>' : '';
  let tabs = `<div class="seg" style="margin-bottom:12px"><button class="${S.gtab === 'quick' ? 'on' : ''}" onclick="S.gtab='quick';refresh()">${icon('edit', 'sm')}إدخال سريع</button><button class="${S.gtab === 'paste' ? 'on' : ''}" onclick="S.gtab='paste';refresh()">${icon('clipboard', 'sm')}لصق ذكي</button><button class="${S.gtab === 'book' ? 'on' : ''}" onclick="S.gtab='book';refresh()">${icon('list', 'sm')}السجل الكامل</button></div>${pendNote}`;
  m.innerHTML = head + tabs + loadingHTML();
  const list = await sectionStudents(p.cls, p.sec, true);
  if (!list.length) return m.innerHTML = head + tabs + emptyHTML('لا يوجد طلاب في هذه الشعبة.', 'users');
  if (S.gtab === 'book') return m.innerHTML = head + tabs + gradebookHTML(list, p);
  const sk = safeKey(p.subj), ek = safeKey(p.exam);
  const pubMax = list.map(s => s.grades?.[sk]?.[ek]).find(g => g && g.v != null);
  S.gMax = pubMax ? gMaxOf(pubMax) : LS.get(`adala_gmax|${p.cls}|${p.subj}|${p.exam}`, 100);
  const maxBox = `<div class="card" style="padding:10px 14px;margin-bottom:12px"><div class="row nw" style="gap:10px"><b class="grow">${icon('edit', 'sm')} درجة الامتحان من</b>
    <input class="in" id="gMax" value="${S.gMax}" inputmode="numeric" dir="ltr" style="width:90px;text-align:center;font-weight:800" oninput="A.gMax(this)"></div>
    <p class="hint" style="margin:6px 0 0">إذا كان الامتحان من 50 أو 70 مثلاً، غيّرها هنا، فتصل لولي الأمر الدرجة بالشكل «45 من 50».</p></div>`;
  tabs += maxBox;

const NAME_HEADS = ['الاسم', 'اسم الطالب', 'الطالب', 'ت', 'التسلسل', 'تسلسل', 'م', 'الرقم', 'اسم'];
function parsePaste(text, subjects) {
  const lines = toEn(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let header = null; const rows = [];
  const isVal = t => /^\d+(\.\d+)?$/.test(t) || /^(غ|غائب|غياب)$/.test(t);
  for (const line of lines) {
    let cells = line.split(/\t|\s*[,،;|]\s*|\s{2,}/).map(c => c.trim()).filter(Boolean);
    const anyVal = cells.some(isVal) || line.split(/\s+/).some(isVal);
    if (!anyVal) {
      if (!header && !rows.length && cells.length > 1) { header = cells; continue; }
      rows.push({ raw: line, name: line.replace(/^\d+\s*[-.)]\s*/, ''), vals: [] }); continue;
    }
    if (cells.length === 1) cells = line.split(/\s+/);
    const nameParts = [], vals = [];
    cells.forEach(c => {
      if (isVal(c)) vals.push(/^\d/.test(c) ? +c : 'غ');
      else c.split(/\s+/).forEach(t => { if (isVal(t)) vals.push(/^\d/.test(t) ? +t : 'غ'); else if (!/^[-.)]+$/.test(t)) nameParts.push(t.replace(/^\d+[-.)]/, '')); });
    });
    rows.push({ raw: line, name: nameParts.join(' ').trim(), vals, lead: /^\d+/.test(cells[0]) });
  }
  let hsubj = null;
  if (header) {
    hsubj = header.filter(h => !NAME_HEADS.includes(h.trim())).map(h => {
      const n = normAr(h); let best = null, bs = 0;
      for (const s of subjects) { const sc = Math.max(ratio(n, normAr(s)), normAr(s).includes(n) || n.includes(normAr(s)) ? .9 : 0); if (sc > bs) { bs = sc; best = s; } }
      return bs >= .7 ? best : null;
    });
  }
  const expected = hsubj ? hsubj.length : 1;
  for (const r of rows) if (r.lead && r.vals.length > expected) r.vals.shift();
  return { rows, hsubj };
}
function matchStudents(rows, list) {
  const norm = list.map(s => ({ s, n: normAr(s.name) }));
  return rows.map(r => {
    const n = normAr(r.name);
    const sc = norm.map(x => ({ s: x.s, v: nameScore(n, x.n) })).sort((a, b) => b.v - a.v);
    const best = sc[0], second = sc[1];
    let st = 'r', pick = '';
    if (!n) st = 'x';
    else if (best && best.v >= .9 && (!second || second.v < best.v - .04)) { st = 'g'; pick = best.s.code; }
    else if (best && best.v >= .6) st = 'y';
    return { ...r, st, pick, cands: sc.filter(x => x.v >= .6).slice(0, 3) };
  });
}

  const subjLine = hsubj ? `المواد المكتشفة: ${hsubj.map(s => s ? esc(s) : '<span class="tag bad">غير معروفة</span>').join('، ')}` : `المادة: <b>${esc(p.subj)}</b> · ${esc(p.exam)}`;

    const options = (r.st === 'y' ? r.cands.map(c => [c.s.code, c.s.name]) : []).concat(list.filter(s => r.st !== 'y' || !r.cands.some(c => c.s.code === s.code)).map(s => [s.code, s.name]));

function annRow(a, extra = '') {

function scopeText(sc = []) {
  if (sc.includes('all')) return 'كل المدرسة';
  return sc.map(x => { const [t, v] = [x.slice(0, 1), x.slice(2)]; if (t === 'c') return clsName(v); const [c, s] = v.split('|'); return `${clsName(c)} / ${s}`; }).join('، ');
}
// ---------- متابعة مشاهدة التبليغات ----------
// ولي الأمر «شاهد» التبليغ إذا فتح صفحة الطالب بعد وقت نشره
async function annAudience(a) {
  const sc = a.scope || []; let l;
  if (sc.includes('all')) l = await allStudents();
  else l = [].concat(...await Promise.all(sc.map(x => { const t = x[0], v = x.slice(2); if (t === 'c') return classStudents(v); const [c, se] = v.split('|'); return sectionStudents(c, se, true); })));
  const m = new Map(); for (const s of l) if ((s.status || 'مستمر') === 'مستمر') m.set(s.code, s);
  const all = [...m.values()].sort((x, y) => (S.classes.findIndex(c => c.id === x.cls) - S.classes.findIndex(c => c.id === y.cls)) || String(x.sec).localeCompare(String(y.sec), 'ar') || x.name.localeCompare(y.name, 'ar'));
  const seen = all.filter(s => (s.parent?.seen || 0) >= a.at);
  return { all, seen, not: all.filter(s => !((s.parent?.seen || 0) >= a.at)) };
}

// ---------- طباعة بطاقات الكودات ----------
const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
// الروابط الأصلية بدون مواقع تقصير: الأندرويد من Google Drive، والآيفون موقع المنصة نفسه
const APK_URL = 'https://drive.google.com/file/d/1HWFI7PjrVoH3avf1eoItTaFTWBF4TdMb/view';
const apkUrl = () => { const u = String(S.school?.apkUrl ?? APK_URL).trim(); return /tinyurl\.com/i.test(u) ? APK_URL : u; };
const IPHONE_URL = 'https://luayhameed333-glitch.github.io/adala-school/';
const appBase = () => location.origin + location.pathname.replace(/index\.html$/, '');
function qrSVG(text) {
  try { const q = window.qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
  catch (e) { return ''; }
}
// ---------- بطاقة طالب واحد كصورة للمشاركة (واتساب، تليغرام...) ----------
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
function drawQR(ctx, text, x, y, size) {
  const q = window.qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = size / (n + 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, size, size); ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) ctx.fillRect(Math.floor(x + (c + 1) * m), Math.floor(y + (r + 1) * m), Math.ceil(m), Math.ceil(m));
}
function wrapLines(ctx, text, w) {
  const out = []; let line = '';
  for (const word of String(text).split(' ')) { const t = line ? line + ' ' + word : word; if (ctx.measureText(t).width > w && line) { out.push(line); line = word; } else line = t; }
  if (line) out.push(line); return out;
}
async function cardCanvas(s) {
  await loadScript(QR_LIB);
  try { await Promise.all(['800 40px Tajawal', '500 30px Tajawal', '700 40px Amiri'].map(f => document.fonts.load(f))); } catch (e) { }
  const W = 1200, H = 1300, P = 60, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d'); const F = (w, sz, fam = 'Tajawal') => `${w} ${sz}px ${fam}, system-ui, sans-serif`;
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#0B4F33'; x.lineWidth = 6; rr(20, 20, W - 40, H - 40, 36); x.stroke();
  x.direction = 'rtl'; x.textAlign = 'right'; x.textBaseline = 'middle';
  // الرأس: الشعار واسم المدرسة
  try { const lg = await loadImg(logoSrc()); x.save(); x.beginPath(); x.arc(W - P - 55, P + 75, 55, 0, Math.PI * 2); x.clip(); x.drawImage(lg, W - P - 110, P + 20, 110, 110); x.restore(); } catch (e) { }
  x.fillStyle = '#0B4F33'; x.font = F(700, 54, 'Amiri'); x.fillText(schoolName(), W - P - 135, P + 70);
  x.fillStyle = '#ddd'; x.fillRect(P, P + 150, W - 2 * P, 3);
  // اسم الطالب وصفه
  x.fillStyle = '#000'; x.font = F(800, 60); x.fillText(s.name, W - P, P + 225);
  x.fillStyle = '#444'; x.font = F(500, 38); x.fillText(`${clsName(s.cls)} / ${s.sec}`, W - P, P + 300);
  // الكود
  x.strokeStyle = '#000'; x.lineWidth = 4; rr(P, P + 345, W - 2 * P, 110, 22); x.stroke();
  x.direction = 'ltr'; x.textAlign = 'center'; x.fillStyle = '#000'; x.font = F(800, 72); x.fillText(fmtCode(s.code), W / 2, P + 402);
  // الرمزين: يمين حمّل التطبيق، يسار كود الطالب
  const apk = apkUrl(), qs = 360, qy = P + 560;
  const slot = (cx, num, label, sub, text) => {
    x.direction = 'rtl'; x.textAlign = 'center'; x.fillStyle = '#000'; x.font = F(800, 42); x.fillText(`${num ? num + ' ' : ''}${label}`, cx, qy - 50);
    drawQR(x, text, cx - qs / 2, qy, qs);
    x.fillStyle = '#555'; x.font = F(500, 30); x.fillText(sub, cx, qy + qs + 38);
  };
  const link = appBase() + '?code=' + s.code;
  if (apk) { slot(W * 0.74, '①', 'حمّل التطبيق', 'للأندرويد', apk); slot(W * 0.26, '②', 'كود الطالب', 'يفتح صفحة الطالب مباشرة', link); x.fillStyle = '#888'; x.font = F(800, 60); x.fillText('←', W / 2, qy + qs / 2); }
  else slot(W / 2, '', 'كود الطالب', 'يفتح صفحة الطالب مباشرة', link);
  // التعليمات
  let y = qy + qs + 100; x.fillStyle = '#ddd'; x.fillRect(P, y - 30, W - 2 * P, 3);
  x.direction = 'rtl'; x.textAlign = 'right'; x.fillStyle = '#222'; x.font = F(500, 33);
  const steps = apk ? ['١. صوّر الرمز ① بكاميرا الهاتف، ثم نزّل التطبيق وثبّته.', '٢. افتح التطبيق ← أولياء الأمور، وصوّر الرمز ② أو اكتب الرقم، ثم اضغط «تفعيل الإشعارات».', 'آيفون: صوّر الرمز ② ثم زر المشاركة ← «إضافة إلى الشاشة الرئيسية».']
    : ['افتح التطبيق ← أولياء الأمور، وصوّر الرمز أو اكتب الرقم، ثم اضغط «تفعيل الإشعارات».'];
  for (const st of steps) for (const ln of wrapLines(x, st, W - 2 * P)) { x.fillText(ln, W - P, y); y += 48; }
  return cv;
}
async function shareCard(s) {
  let cv; try { cv = await cardCanvas(s); } catch (e) { return toast('تعذّر تحميل مولّد رمز QR، يرجى التأكد من الإنترنت', 'bad'); }
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const name = `بطاقة ${s.name}.png`.replace(/[\\/:*?"<>|]/g, '');
  const file = new File([blob], name, { type: 'image/png' });
  // الكود بدون فراغات حتى ما ينقلب ترتيب الأرقام بالواتساب
  const text = `${schoolName()}\nالطالب: ${s.name}\nالكود: ${s.code}\nتحميل التطبيق: ${apkUrl() || appBase()}`;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name, text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('تم حفظ الصورة في الهاتف، ويمكن إرسالها من معرض الصور', 'ok');
}

    el.style.transform = `translate(${e.clientX - sx - r3.left}px,${e.clientY - sy - r3.top}px) scale(1.06)`;
  });
  const end = () => { if (!el) return; el.classList.remove('drag'); el.animate([{ transform: el.style.transform }, { transform: 'none' }], { duration: 160, easing: 'ease-out' }); el.style.transform = ''; el = null; };

}

const AW_TPL = {
  1: 'حضرة ولي أمر الطالب ({الطالب}) المحترم\nالصف: {الصف} / {الشعبة}\n\nتحية طيبة...\nنودّ إعلامكم بأن ابنكم قد تغيّب عن الدوام الرسمي مدة ({العدد}) خلال العام الدراسي الحالي، ويُعدّ هذا إنذاراً أولياً بالغياب.\nنرجو متابعة دوامه والحرص على انتظامه، حفاظاً على مستواه الدراسي.\n\nمع التقدير\nإدارة {المدرسة}',
  2: 'حضرة ولي أمر الطالب ({الطالب}) المحترم\nالصف: {الصف} / {الشعبة}\n\nتحية طيبة...\nنودّ إعلامكم بأن ابنكم قد تغيّب عن الدوام الرسمي مدة ({العدد}) خلال العام الدراسي الحالي، ويُعدّ هذا إنذاراً ثانياً بالغياب.\nنرجو مراجعة إدارة المدرسة ومتابعة دوام ابنكم، علماً أن استمرار الغياب يعرّضه للإجراءات المنصوص عليها في التعليمات النافذة.\n\nمع التقدير\nإدارة {المدرسة}',

};
const awTpl = n => S.school?.absWarnTpl?.[n] || AW_TPL[n];
// اليوم ينحسب غياب كامل إذا انسجل بدون مادة، أو إذا غاب 4 حصص فأكثر بنفس اليوم
const LESSONS_DAY = 4;
const fullDays = s => {
  const by = {}; for (const a of s.absences || []) { const o = by[a.d] ??= { full: false, l: new Set() }; if (!a.subj) o.full = true; else o.l.add(a.subj + '|' + (a.p ?? a.at)); }
  return Object.values(by).filter(o => o.full || o.l.size >= LESSONS_DAY).length;
};
const daysTxt = n => n === 1 ? 'يوم واحد' : n === 2 ? 'يومين' : n <= 10 ? `${n} أيام` : `${n} يوماً`;
const nextWorkISO = () => { const d = new Date(); do d.setDate(d.getDate() + 1); while (d.getDay() === 5 || d.getDay() === 6); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
// أعلى إنذار مستحق وما انرسل
const awDue = s => { const d = fullDays(s); let due = null; for (const L of AW_LV) if (d >= L.at && !Object.keys(s.absWarn || {}).some(k => +k >= L.n)) due = L; return due; };
const awText = (s, n, days, date) => fillTpl(awTpl(n), { 'الطالب': s.name, 'الصف': clsName(s.cls), 'الشعبة': s.sec, 'العدد': daysTxt(days), 'المدرسة': schoolName(), 'اليوم': date ? dayName(date) : '', 'التاريخ': date ? fmtISO(date) : '' });

function awOps(s, n, text, date) {
  const t = now(), ops = [], L = AW_LV[n - 1];
  const data = { [`absWarn.${n}`]: { at: t, by: S.me.name, days: fullDays(s) }, feed: UNION(feedItem('warn', text, { title: L.t })), upd: t };

  }
  ops.unshift({ op: 'update', c: 'students', id: s.code, data });
  return ops;
}

ADM.staff = async m => {
  const l = (await DB.list('staff')).map(x => ({ ...x, uid: x._id })).sort((a, b) => (a.role === 'admin' ? -1 : 0) - (b.role === 'admin' ? -1 : 0) || a.name.localeCompare(b.name, 'ar'));
  const seen = await Promise.all(l.map(x => DB.get('log', 'seen_' + x.uid).catch(() => null)));
  l.forEach((x, i) => { x.seen = seen[i]; });
  // مرة وحدة: اللي دخلوا قبل هذا التحديث نعرفهم من عملياتهم القديمة بالسجل
  if (l.some(x => !x.seen) && !LS.get('adala_seenmig', 0)) {
    try {
      const first = {};
      for (const g of await DB.list('log')) if (g.by && !String(g._id).startsWith('seen_') && (!first[g.by] || g.at < first[g.by])) first[g.by] = g.at;
      const ops = [];
      for (const x of l) if (!x.seen && first[x.uid]) {
        x.seen = { at: first[x.uid], by: x.uid, byName: x.name, action: 'أول دخول إلى المنصة', detail: (ROLE_NAME[x.role] || '') + ' · ' + x.username, seen: 1 };
        ops.push({ op: 'set', c: 'log', id: 'seen_' + x.uid, data: x.seen });
      }
      if (ops.length) await DB.batch(ops);
      LS.set('adala_seenmig', 1);
    } catch (e) { console.warn(e); }
  }
  S.staffList = l;
  const nIn = l.filter(x => x.seen).length;
  m.innerHTML = `<button class="btn pri block" style="margin-bottom:12px" onclick="A.editStaff()">${icon('plus', 'sm')}إضافة مدرس أو مشرف</button>
    <div class="card" style="padding:12px 14px;margin-bottom:12px"><div class="row nw" style="justify-content:space-between"><b>دخل المنصة ${nIn} من ${l.length}</b><span class="small muted">لم يدخل بعد: ${l.length - nIn}</span></div>
      <div style="height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px"><div style="height:100%;width:${l.length ? Math.round(nIn / l.length * 100) : 0}%;background:var(--ok)"></div></div></div>
    <div class="card" style="padding:4px 14px">${l.map(x => `<div class="li" style="padding:0;gap:4px"><button class="li" style="flex:1;min-width:0;background:none;border:0;text-align:right;cursor:pointer" onclick="A.editStaff('${x.uid}')">
      <span class="num">${icon(x.role === 'teacher' || x.role === 'counselor' ? 'book' : 'shield', 'sm')}</span><div class="t"><b>${esc(x.name)} ${x.active === false ? '<span class="tag bad">موقوف</span>' : ''}</b>
      <small>${ROLE_NAME[x.role]}${x.counsel || x.role === 'counselor' ? ` · <span class="tag warn">${icon('heart', 'sm')} مرشد تربوي</span>` : ''} · <span dir="ltr">${esc(x.username)}</span>${x.assign?.length ? ` · ${x.assign.length} تكليف` : ''}</small>
      <small>${x.seen ? `<span class="tag ok">دخل</span> أول دخول: ${fmtDate(x.seen.at)}` : '<span class="tag bad">لم يدخل بعد</span>'}</small></div></button>
      <button class="ib" style="color:#25D366" onclick="A.staffCard('${x.uid}')" aria-label="إرسال بطاقة الدخول">${icon('whatsapp', 'sm')}</button></div>`).join('')}</div>`;
};
// بطاقة الدخول: كلمة السر ما تنحفظ بالتطبيق، تكتبها الإدارة وقت الإرسال إذا تريدها بالصورة
A.staffCard = (id, pw = '') => {
  const u = S.staffList.find(s => s.uid === id); if (!u) return;
  openModal('بطاقة الدخول', `<p style="margin-top:0">${esc(u.name)} · اسم المستخدم: <b dir="ltr">${esc(u.username)}</b></p>
    <label class="f"><span>كلمة السر (اختياري، لتظهر في الصورة)</span><input class="in" id="scP" dir="ltr" autocomplete="off" value="${esc(pw)}" placeholder="اتركه فارغاً إذا لا تريدها في الصورة"></label>
    <p class="hint">كلمة السر لا تُحفظ في التطبيق، لذلك تُكتب هنا عند الإرسال فقط.</p>
    <button class="btn ok block" id="scB" onclick="A.staffCardGo('${id}')">${icon('whatsapp', 'sm')}إرسال البطاقة (صورة)</button>`);
};
A.staffCardGo = id => busy('#scB', async () => { const u = S.staffList.find(s => s.uid === id); await shareStaffCard(u, $('#scP').value.trim()); });
A.editStaff = id => {
  const x = S.staffList.find(s => s.uid === id) || { name: '', username: '', role: 'teacher', perms: {}, assign: [], active: true };
  if (x.role === 'admin' && S.me.role !== 'admin') return toast('يعدّل حساب الإدارة المدير فقط', 'bad');
  S.ed = { id, role: x.role === 'counselor' ? 'teacher' : x.role, perms: { ...(x.perms || {}) }, assign: (x.assign || []).slice() };
  const xc = !!x.counsel || x.role === 'counselor';
  const c0 = S.classes[0];
  openModal(id ? 'تعديل الحساب' : 'حساب جديد', `
    <label class="f"><span>الاسم الظاهر</span><input class="in" id="sfN" value="${esc(x.name)}" placeholder="مثال: الأستاذ علي حسن"></label>
    ${id ? `<p class="small muted">اسم المستخدم: <b dir="ltr">${esc(x.username)}</b></p>` : `<label class="f"><span>اسم المستخدم (حروف إنكليزية أو أرقام)</span><input class="in" id="sfU" dir="ltr" autocapitalize="off" placeholder="ali.hasan"></label>
    <label class="f"><span>كلمة السر (6 على الأقل)</span>${pwField('sfP', '', 'new-password')}</label>`}
    ${x.role === 'admin' ? '' : `<div class="sec-t" style="margin-top:0">نوع الحساب</div><div class="seg" id="sfR"><button class="${x.role === 'teacher' || x.role === 'counselor' ? 'on' : ''}" onclick="A.sfRole('teacher')">مدرس</button><button class="${x.role === 'supervisor' ? 'on' : ''}" onclick="A.sfRole('supervisor')">مشرف (لوحة الإدارة)</button></div>`}
    <div id="sfPerms" style="margin-top:12px"></div>
    ${x.role === 'admin' ? '' : `<label class="row nw" style="cursor:pointer;margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px"><input type="checkbox" id="sfC" ${xc ? 'checked' : ''} style="width:22px;height:22px"><span>${icon('heart', 'sm')} <b>صلاحية الإرشاد التربوي</b><br><small class="muted">يرى حالات الطلاب ويتواصل مع أولياء الأمور</small></span></label>`}
    <div class="sec-t">المواد والشعب التي يدرّسها</div>
    <div id="sfAsg"></div>
    ${c0 ? `<div class="card" style="box-shadow:none;background:var(--soft);padding:12px"><div class="grid2"><label class="f"><span>الصف</span><select class="in" id="asC" onchange="A.asgCls(this.value)">${opt(S.classes.map(c => [c.id, c.name]), c0.id)}</select></label>
      <label class="f"><span>الشعبة</span><select class="in" id="asS">${opt([['*', 'كل الشعب'], ...(c0.sections || [])], '*')}</select></label></div>
      <label class="f"><span>المادة</span><select class="in" id="asJ">${opt(c0.subjects || [])}</select></label>
      <button class="btn block" onclick="A.asgAdd()">${icon('plus', 'sm')}إضافة التكليف</button></div>` : '<p class="hint">أضف الصفوف أولاً لتتمكن من توزيع المواد.</p>'}
    ${id && x.role !== 'admin' ? `<label class="row nw" style="margin:14px 0;cursor:pointer"><input type="checkbox" id="sfA" ${x.active !== false ? 'checked' : ''} style="width:22px;height:22px"><span>الحساب فعّال (عند إزالة العلامة لا يمكنه الدخول)</span></label>` : ''}
    <div class="btns" style="margin-top:12px">${id && x.role !== 'admin' && S.me.role === 'admin' ? `<button class="btn danger" onclick="A.delStaff('${id}')">${icon('trash', 'sm')}حذف</button>` : ''}<button class="btn pri" id="sfB" onclick="A.saveStaff()">${icon('check', 'sm')}حفظ</button></div>
    ${id ? `<button class="btn ok block" style="margin-top:10px" onclick="A.closeModal();A.staffCard('${id}')">${icon('whatsapp', 'sm')}إرسال بطاقة الدخول (صورة)</button>` : ''}
    ${!id ? '' : '<p class="hint">إذا نسي المدرس كلمة السر: يُحذف حسابه ويُنشأ له حساب جديد باسم مستخدم آخر، وتُضاف تكليفاته من جديد.</p>'}`);
  if (x.role !== 'admin') renderPerms();
  renderAsg();
};
A.sfRole = r => { S.ed.role = r; $$('#sfR button').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes(`'${r}'`))); renderPerms(); };
function renderPerms() {
  const box = $('#sfPerms'); if (!box) return;
  if (S.ed.role !== 'supervisor') return box.innerHTML = '';
  const p = S.ed.perms;
  box.innerHTML = `<div class="card" style="box-shadow:none;background:var(--soft);padding:12px"><label class="row nw" style="cursor:pointer;margin-bottom:8px"><input type="checkbox" ${p.all ? 'checked' : ''} onchange="S.ed.perms.all=this.checked;renderPerms()" style="width:22px;height:22px"><b>صلاحية كاملة</b></label>
    ${p.all ? '<p class="small muted" style="margin:0">يستطيع القيام بكل الإجراءات في بوابة الإدارة، عدا تعديل حساب المدير.</p>' : Object.entries(PERMS).map(([k, t]) => `<label class="row nw" style="cursor:pointer;margin:6px 0"><input type="checkbox" ${p[k] ? 'checked' : ''} onchange="S.ed.perms['${k}']=this.checked" style="width:20px;height:20px"><span>${t}</span></label>`).join('')}</div>`;
}
window.renderPerms = renderPerms;
function renderAsg() {
  const box = $('#sfAsg'); if (!box) return;
  box.innerHTML = S.ed.assign.length ? `<div class="chips" style="margin-bottom:10px">${S.ed.assign.map((a, i) => `<span class="tag pri" style="padding:6px 10px">${esc(clsName(a.cls))} / ${esc(a.sec)} · ${esc(a.subj)} <button onclick="A.asgDel(${i})" style="border:0;background:none;color:var(--bad);cursor:pointer;padding:0 0 0 2px" aria-label="حذف">✕</button></span>`).join('')}</div>` : '<p class="hint" style="margin-top:0">لا توجد تكليفات بعد.</p>';
}
A.asgCls = id => { const c = S.classes.find(x => x.id === id); $('#asS').innerHTML = opt([['*', 'كل الشعب'], ...(c?.sections || [])], '*'); $('#asJ').innerHTML = opt(c?.subjects || []); };
A.asgAdd = () => {
  const cls = val('asC'), sec = val('asS'), subj = val('asJ'); if (!subj) return toast('اختر المادة', 'bad');
  const c = S.classes.find(x => x.id === cls); const secs = sec === '*' ? c.sections : [sec];
  for (const s of secs) if (!S.ed.assign.some(a => a.cls === cls && a.sec === s && a.subj === subj)) S.ed.assign.push({ cls, sec: s, subj });
  renderAsg();
};
A.asgDel = i => { S.ed.assign.splice(i, 1); renderAsg(); };
A.saveStaff = () => busy('#sfB', async () => {
  const name = val('sfN'); if (!name) return toast('اكتب الاسم', 'bad');
  const e = S.ed;
  if (!e.id) {
    const u = val('sfU'), p = $('#sfP').value;
    if (!validUser(u)) return toast('يجب أن يتكون اسم المستخدم من حروف إنكليزية أو أرقام (3 على الأقل)', 'bad');
    if (p.length < 6) return toast('يجب ألا تقل كلمة السر عن 6 أحرف', 'bad');
    const id = await AU.create(u, p);
    await DB.set('staff', id, { name, username: u.toLowerCase(), role: e.role, perms: e.role === 'supervisor' ? e.perms : {}, assign: e.assign, counsel: !!$('#sfC')?.checked, active: true, at: now() });
    await log('إضافة حساب', `${name} (${ROLE_NAME[e.role]})`);
    S.newSt = { name, username: u.toLowerCase(), role: e.role }; S.newPw = p;
    A.closeModal(); openModal('تمت إضافة الحساب', `<p>سلّم هذه المعلومات إلى  <b>${esc(name)}</b>:</p><div class="card" style="box-shadow:none;background:var(--soft)"><p style="margin:0">اسم المستخدم: <b dir="ltr">${esc(u.toLowerCase())}</b></p><p style="margin:6px 0 0">كلمة السر: <b dir="ltr">${esc(p)}</b></p></div><p class="hint">ويمكنه تغيير كلمة السر من الإعدادات بعد الدخول.</p><button class="btn ok block" id="scB" onclick="busy('#scB',()=>shareStaffCard(S.newSt,S.newPw))">${icon('whatsapp', 'sm')}إرسال بطاقة الدخول (صورة)</button><button class="btn block" style="margin-top:8px" onclick="A.closeModal()">تمام</button>`, { onClose: refresh });
    return;
  }
  const old = S.staffList.find(s => s.uid === e.id);
  const patch = { name };
  if (old.role === 'admin') patch.assign = e.assign;
  else Object.assign(patch, { role: e.role, perms: e.role === 'supervisor' ? e.perms : {}, assign: e.assign, counsel: !!$('#sfC')?.checked, active: $('#sfA')?.checked !== false });
  await DB.update('staff', e.id, patch); await log('تعديل حساب', name);
  if (e.id === S.me.uid) await loadMe();
  A.closeModal(); toast('تم الحفظ', 'ok'); refresh();
});
A.delStaff = id => busy(null, async () => {
  const x = S.staffList.find(s => s.uid === id);
  if (!await confirmBox(`حذف حساب ${x.name}؟ لن يتمكن من الدخول بعد ذلك.`, { ok: 'حذف', danger: true })) return;
  await DB.del('staff', id); await log('حذف حساب', x.name); A.closeModal(); refresh();
});

// ---------- كشف الغياب اليومي للمدرسة كلها ----------
ADM.daily = async m => {
  S.dyD ??= todayISO(); S.dyC ??= '*';
  const head = `<div class="card" style="padding-bottom:4px"><div class="grid2">
    <label class="f"><span>اليوم</span><input type="date" class="in" value="${S.dyD}" dir="ltr" style="direction:ltr;unicode-bidi:plaintext;text-align:right" onchange="S.dyD=this.value;refresh()"></label>
    <label class="f"><span>الصف</span><select class="in" onchange="S.dyC=this.value;refresh()">${opt([['*', 'كل المدرسة'], ...S.classes.map(c => [c.id, c.name])], S.dyC)}</select></label></div>
    <button class="btn sm" style="margin:0 0 10px" onclick="A.allRefresh()">${icon('refresh', 'sm')}تحديث البيانات</button></div>`;
  m.innerHTML = head + loadingHTML();
  const l = (await allStudents()).filter(s => S.dyC === '*' || s.cls === S.dyC);
  const rows = l.map(s => ({ s, a: (s.absences || []).filter(x => x.d === S.dyD) })).filter(r => r.a.length)
    .sort((x, y) => (S.classes.findIndex(c => c.id === x.s.cls) - S.classes.findIndex(c => c.id === y.s.cls)) || String(x.s.sec).localeCompare(String(y.s.sec), 'ar') || x.s.name.localeCompare(y.s.name, 'ar'));
  S.dyRows = rows;
  const groups = []; for (const r of rows) { const k = r.s.cls + '|' + r.s.sec; let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, cls: r.s.cls, sec: r.s.sec, l: [] }); g.l.push(r); }
  const lessons = r => r.a.map(x => x.subj || 'دوام عام').join('، ');
  const box = (v, t) => `<div class="card" style="margin:0;padding:12px;text-align:center"><div style="font-size:24px;font-weight:800">${v}</div><div class="small muted">${t}</div></div>`;
  m.innerHTML = head + `<p class="hint" style="margin:0 2px 10px">${dayName(S.dyD)} ${fmtISO(S.dyD)}</p>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px">${box(rows.length, 'طالب غائب')}${box(rows.reduce((n, r) => n + r.a.length, 0), 'حالة غياب')}${box(groups.length, 'شعبة')}</div>
    ${rows.length ? `<button class="btn block" style="margin-bottom:12px" onclick="A.dyPrint()">${icon('print', 'sm')}طباعة كشف الغياب اليومي</button>` : ''}
    ${groups.length ? groups.map(g => `<div class="sec-t">${esc(clsName(g.cls))} / ${esc(g.sec)} <small class="muted" style="font-weight:400">(${g.l.length})</small></div>
      <div class="card" style="padding:4px 14px">${g.l.map((r, i) => `<button class="li" style="width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:right;cursor:pointer" onclick="A.studentCard('${r.s.code}')"><span class="num">${i + 1}</span><div class="t"><b style="font-weight:600">${esc(r.s.name)}</b><small>${esc(lessons(r))}</small></div>${r.a.length > 1 ? `<span class="tag warn">${r.a.length} دروس</span>` : ''}</button>`).join('')}</div>`).join('')
      : emptyHTML('لا توجد غيابات مسجّلة في هذا اليوم', 'calx')}`;
};
A.allRefresh = () => { S.allSt = null; refresh(); };
A.dyPrint = async () => {
  const rows = S.dyRows || []; if (!rows.length) return;
  let pr = $('#print'); if (!pr) { pr = document.createElement('div'); pr.id = 'print'; document.body.appendChild(pr); }
  pr.className = '';
  pr.innerHTML = `<div class="plist"><h2>${esc(schoolName())}: كشف الغياب اليومي</h2><p>${dayName(S.dyD)} ${fmtISO(S.dyD)} · عدد الطلاب الغائبين ${rows.length}</p>
    <table><thead><tr><th>ت</th><th>اسم الطالب</th><th>الصف والشعبة</th><th>الدروس</th></tr></thead><tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.s.name)}</td><td>${esc(clsName(r.s.cls))} / ${esc(r.s.sec)}</td><td>${esc(r.a.map(x => x.subj || 'دوام عام').join('، '))}</td></tr>`).join('')}</tbody></table></div>`;
  await sleep(150); window.print();
};
// ---------- متابعة أولياء الأمور: منو دخل التطبيق ومنو بعده ----------
ADM.parents = async m => {
  if (!S.classes.length) return m.innerHTML = noCombosHTML();
  // افتراضياً: أول صف، ويبين اللي ما دخلوا أولاً
  S.pvc ??= '*'; S.pvs ??= '*'; S.pvf ??= 'out'; S.pvq ??= '';
  const c = S.classes.find(x => x.id === S.pvc);
  const head = `<div class="card" style="padding-bottom:4px"><div class="grid2"><label class="f"><span>الصف</span><select class="in" onchange="S.pvc=this.value;S.pvs='*';refresh()">${opt([['*', 'كل المدرسة'], ...S.classes.map(c => [c.id, c.name])], S.pvc)}</select></label>
    <label class="f"><span>الشعبة</span><select class="in" onchange="S.pvs=this.value;refresh()" ${c ? '' : 'disabled'}>${opt([['*', 'كل الشعب'], ...(c?.sections || [])], S.pvs)}</select></label></div>
    <button class="btn sm" style="margin:0 0 10px" onclick="A.allRefresh()">${icon('refresh', 'sm')}تحديث البيانات</button></div>`;
  m.innerHTML = head + loadingHTML();
  let l = (await allStudents()).filter(s => S.pvc === '*' || s.cls === S.pvc);
  l = l.filter(s => (s.status || 'مستمر') === 'مستمر' && (S.pvs === '*' || s.sec === S.pvs));
  l.sort((a, b) => (S.classes.findIndex(x => x.id === a.cls) - S.classes.findIndex(x => x.id === b.cls)) || String(a.sec).localeCompare(String(b.sec), 'ar') || a.name.localeCompare(b.name, 'ar'));
  const n = l.length, nIn = l.filter(pvOn).length, nPush = l.filter(s => s.parent?.push).length, pct = n ? Math.round(nIn / n * 100) : 0;
  S.pvAll = l; S.pvList = l.filter(s => !pvOn(s));
  const box = (v, t) => `<div class="card" style="margin:0;padding:12px;text-align:center"><div style="font-size:24px;font-weight:800">${v}</div><div class="small muted">${t}</div></div>`;
  m.innerHTML = head + `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px">
      ${box(`${nIn} من ${n}`, `دخلوا التطبيق (${pct}٪)${S.pvc === '*' ? ' · كل المدرسة' : ' · ' + esc(clsName(S.pvc)) + (S.pvs === '*' ? '' : ' / ' + esc(S.pvs))}`)}${box(n - nIn, 'لم يدخلوا بعد')}${box(nPush, 'فعّلوا الإشعارات')}${box(n ? Math.round(nPush / n * 100) + '٪' : '0٪', 'نسبة الإشعارات')}</div>
    <div style="height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:-2px 0 14px"><div style="height:100%;width:${pct}%;background:var(--ok)"></div></div>
    <div class="seg" id="pvSeg" style="margin-bottom:10px">${[['out', `لم يدخلوا (${n - nIn})`], ['in', `دخلوا (${nIn})`], ['all', `الكل (${n})`]].map(([k, t]) => `<button class="${S.pvf === k ? 'on' : ''}" data-k="${k}" onclick="A.pvF('${k}')">${t}</button>`).join('')}</div>
    <input class="in" id="pvQ" type="search" autocomplete="off" placeholder="بحث باسم الطالب" value="${esc(S.pvq)}" oninput="A.pvSearch(this.value)" style="margin-bottom:10px">
    ${S.pvList.length ? `<button class="btn block" style="margin-bottom:12px" onclick="A.pvPrint()">${icon('print', 'sm')}طباعة قائمة من لم يدخلوا (${S.pvList.length})</button>` : ''}
    <div class="card" style="padding:4px 14px" id="pvList"></div>
    <p class="hint">«دخل» تعني أن ولي الأمر فتح التطبيق ودخل بكود الطالب مرة واحدة على الأقل. ولمن لم يدخل، يمكن إعادة إرسال بطاقة الطالب إليه بزر ${icon('whatsapp', 'sm')}.</p>`;
  pvRender();
};
const pvOn = s => !!(s.parent?.first || s.parent?.seen || s.parent?.last);
function pvRender() {

A.logDel = days => busy(null, async () => {
  if (S.me.role !== 'admin') return toast('حذف السجل للمدير فقط', 'bad');

  if (!ids.length) return toast('لا توجد عمليات في هذه المدة');

A.logoEditor = src => {
  openModal('ضبط شعار المدرسة', `<div class="lgx"><canvas id="lgc" width="600" height="600"></canvas></div>
    <label class="f"><span>التكبير والتصغير</span><div class="row nw"><button class="btn sm" onclick="A.lgZoom(-0.1)" aria-label="تصغير">−</button><input type="range" id="lgz" min="0.2" max="5" step="0.01" value="1" class="grow" oninput="A.lgZoomTo(+this.value)"><button class="btn sm" onclick="A.lgZoom(0.1)" aria-label="تكبير">+</button></div></label>

    <button class="btn pri block" id="lgB" style="margin-top:10px" onclick="A.lgSave()">${icon('check', 'sm')}حفظ الشعار</button>`);
  const img = new Image();
  img.onload = () => { S.lg = { img, z: 1, x: 0, y: 0, shape: 'circle' }; A.lgFit(); bindLogoCanvas(); };
  img.onerror = () => toast('تعذّر فتح الصورة', 'bad');
  img.src = src;
};
function lgBase() { const { img } = S.lg; return 600 / Math.min(img.width, img.height); }
function lgDraw(ctx = $('#lgc')?.getContext('2d'), size = 600, overlay = true) {
  if (!ctx || !S.lg) return;
  const { img, z, x, y, shape } = S.lg, k = size / 600, sc = lgBase() * z * k;
  ctx.clearRect(0, 0, size, size);
  if (overlay) { ctx.fillStyle = '#e9eeed'; ctx.fillRect(0, 0, size, size); }
  ctx.save();
  if (!overlay) { ctx.beginPath(); if (shape === 'circle') ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); else ctx.rect(0, 0, size, size); ctx.clip(); }
  ctx.drawImage(img, size / 2 + x * k - img.width * sc / 2, size / 2 + y * k - img.height * sc / 2, img.width * sc, img.height * sc);
  ctx.restore();
  if (overlay) {
    ctx.save(); ctx.fillStyle = 'rgba(10,25,22,.55)'; ctx.beginPath(); ctx.rect(0, 0, size, size);
    if (shape === 'circle') ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2, true); else ctx.rect(size - 4, 4, -(size - 8), size - 8);
    ctx.fill('evenodd'); ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 4; ctx.beginPath();
    if (shape === 'circle') ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2); else ctx.rect(4, 4, size - 8, size - 8);
    ctx.stroke(); ctx.restore();
  }
}
function bindLogoCanvas() {
  const c = $('#lgc'); const pts = new Map(); let last = null, pinch = null;
  const pos = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * 600 / r.width, y: (e.clientY - r.top) * 600 / r.height }; };
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); pts.set(e.pointerId, pos(e)); last = pos(e); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: S.lg.z }; } });
  c.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; const p = pos(e); pts.set(e.pointerId, p);
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; A.lgZoomTo(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
    if (last) { S.lg.x += p.x - last.x; S.lg.y += p.y - last.y; last = p; lgDraw(); }
  });
  const up = e => { pts.delete(e.pointerId); pinch = null; last = pts.size ? [...pts.values()][0] : null; };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  c.addEventListener('wheel', e => { e.preventDefault(); A.lgZoom(e.deltaY < 0 ? .05 : -.05); }, { passive: false });
}
A.lgZoomTo = z => { if (!S.lg) return; S.lg.z = Math.min(5, Math.max(.2, z)); const r = $('#lgz'); if (r) r.value = S.lg.z; lgDraw(); };
A.lgZoom = d => A.lgZoomTo(S.lg.z + d);
A.lgFit = () => { if (!S.lg) return; S.lg.x = 0; S.lg.y = 0; A.lgZoomTo(1); };

function finalOf(gr) {
  const out = {};
  for (const [sj, ex] of Object.entries(gr || {})) {
    const fin = pct(ex[safeKey('الامتحان النهائي')]);
    if (typeof fin === 'number') { out[sj] = fin; continue; }
    const vs = Object.values(ex).map(x => pct(x)).filter(v => typeof v === 'number');
    if (vs.length) out[sj] = Math.round(vs.reduce((a, b) => a + b, 0) / vs.length * 10) / 10;
  }
  return out;
}
const avgOf = o => { const v = Object.values(o); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

// ---------- مسح رمز QR ----------
const JSQR = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
A.scanQR = async () => {
  if (!navigator.mediaDevices?.getUserMedia) return toast('الكاميرا غير متاحة، يرجى كتابة الرقم يدوياً', 'bad');
  openModal('مسح رمز QR', `<div class="scan"><video id="qv" playsinline muted></video><div class="fr"></div></div><p class="muted small" style="text-align:center">وجّه الكاميرا على الرمز المطبوع ببطاقة الطالب</p>`, { onClose: stopScan });
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch (e) { A.closeModal(); return toast('لم يُسمح باستخدام الكاميرا. يرجى السماح للتطبيق بذلك أو كتابة الرقم يدوياً', 'bad'); }
  S.scan = { stream, on: true };
  const v = $('#qv'); v.srcObject = stream; await v.play().catch(() => { });
  let det = null;
  if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { } }
  if (!det) await loadScript(JSQR).catch(() => { });
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (!S.scan?.on) return;
    let txt = null;
    try {
      if (det) { const r = await det.detect(v); if (r[0]) txt = r[0].rawValue; }
      else if (window.jsQR && v.videoWidth) {
        cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0);
        const r = window.jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); if (r) txt = r.data;
      }
    } catch (e) { }
    if (txt) {
      let code = ''; try { code = new URL(txt).searchParams.get('code') || ''; } catch (e) { code = txt; }
      code = toEn(code).replace(/\D/g, '');
      if (code.length === 12) { A.closeModal(); return A.openCode(code); }
    }
    setTimeout(tick, 220);
  };
  if (!det && !window.jsQR) { A.closeModal(); return toast('تعذّر تحميل قارئ الرمز، يرجى التأكد من الإنترنت أو كتابة الرقم يدوياً', 'bad'); }
  tick();
};
function stopScan() { if (S.scan) { S.scan.on = false; S.scan.stream?.getTracks().forEach(t => t.stop()); S.scan = null; } }

function lineChart(pts) {
  const W = 340, H = 170, p = 28, n = pts.length;
  const x = i => p + (W - 2 * p) * (n === 1 ? .5 : i / (n - 1));
  const y = v => H - p - (H - 2 * p) * (v / 100);
  const line = pts.map((t, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(t.v).toFixed(1)}`).join(' ');
  const pm = y(passMark());
  return `<svg viewBox="0 0 ${W} ${H + 26}" role="img" aria-label="منحنى المعدل">
    <line x1="${p}" x2="${W - p}" y1="${pm}" y2="${pm}" stroke="var(--bad)" stroke-dasharray="4 4" opacity=".6"/>
    <path d="${line}" fill="none" stroke="var(--pri2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((t, i) => `<circle cx="${x(i)}" cy="${y(t.v)}" r="5" fill="var(--card)" stroke="var(--pri2)" stroke-width="2.5"/><text x="${x(i)}" y="${y(t.v) - 10}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${Math.round(t.v)}</text><text x="${x(i)}" y="${H + 14}" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(t.e)}</text>`).join('')}
  </svg>`;
}

// حالات الطلاب (صحية، نفسية، أيتام...) يثبّتها المرشد، وولي الأمر يأشّر حالة ابنه ويتواصل ويّا المرشد.
// المدرسون يشوفون فقط الحالات اللي يختار المرشد إظهارها، ويّا ملاحظته إلهم.
// البيانات: ملف الطالب ← counsel (يكتبه المرشد) و parent.cs (يكتبه ولي الأمر)
const CS_TYPES = [

  ['divorce', 'انفصال الوالدين'], ['family', 'ظرف أسري أو اجتماعي'], ['study', 'صعوبات تعلّم أو ضعف دراسي'], ['other', 'حالة أخرى']
